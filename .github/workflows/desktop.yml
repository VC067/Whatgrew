name: Desktop build check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15-intel
            name: macos-intel
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
        working-directory: apps/desktop
      - name: Build Tauri desktop app
        run: npm run tauri build
        working-directory: apps/desktop
      - name: Save unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatgrew-${{ matrix.name }}
          path: |
            target/release/bundle/**/*
            apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
