name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test -p wg-core -p wg-cli
      - name: Lints
        run: cargo clippy -p wg-core -p wg-cli --all-targets -- -D warnings
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
